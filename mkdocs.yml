site_name: UnDb
site_description: Documentação de produto, requisitos e arquitetura do UnDb
site_url: https://unb-mds.github.io/2026-02-UnDb/
repo_url: https://github.com/unb-mds/2026-02-UnDb
repo_name: unb-mds/2026-02-UnDb
edit_uri: edit/develop/docs/

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Usar tema claro
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy

nav:
  - Início: index.md
  - Produto:
      - Visão: visao.md
      - Requisitos: requisitos.md
      - Board no Figma: figma.md
  - Arquitetura:
      - Visão e decisões: arquitetura.md
      - ADRs — catálogo e manutenção: adrs/index.md
      - Template de ADR: adrs/template.md
      - ADR 09 — estratégia de qualidade: adrs/09-estrategia-qualidade.md
      - Modelos de dados: modelos.md
      - Importação do SIGAA: importacao-sigaa.md
      - Operação do SIGAA: operacao-importacao-sigaa.md
      - Hospedagem e operação pública: hospedagem.md
      - Acesso PostgreSQL da API: acesso-postgresql-api.md
      - Inicialização no Render: inicializacao-render.md
  - Releases:
      - Release 1.0.0: releases/1.0.0.md
      - Release 1.1.0: releases/1.1.0.md
      - Release 2.0.0 — planejamento: releases/2.0.0-planejamento.md
      - Release 2.0.0 — reconciliação documental: releases/2.0.0-reconciliacao.md
  - Estudos:
      - Auditoria e agenda SIGAA — Issue 164: estudos/verificacao-importacao-sigaa-issue-164.md
      - Acesso PostgreSQL — Issue 170: estudos/verificacao-acesso-postgresql-issue-170.md
      - Importação no Neon — 10/11/2026: estudos/importacao-neon-2026-11-10.md
      - Identidade, conta e catálogo — PRs 214 e 215: estudos/identidade-conta-catalogo-2026-11-10.md
      - Lint e tipos — Issue 189: estudos/verificacao-lint-tipos-issue-189.md
      - Denúncia e agradecimentos: estudos/denuncia-agradecimentos-issue-193.md
      - Fila de moderação: estudos/fila-moderacao-issue-162.md
      - Cobertura de testes — Issue 190: estudos/cobertura-testes-issue-190.md
      - Mapeamento do SIGAA: estudos/mapeamento-sigaa.md
      - Prova de conceito do SIGAA: estudos/sigaa-poc.md
      - Docker: estudos/docker.md
      - Busca, comparação e avaliação: estudos/observacao-jornada-busca-comparacao.md
      - Preparação da Validação da Jornada: estudos/validacao-prototipo-jornada-issue-153.md
      - Resultados do reteste da jornada: estudos/resultados-reteste-jornada-issue-153.md
      - Protótipo adaptado aos relatos de uso: estudos/ajustes-prototipo-jornada-issue-153.md
      - Integração visual da jornada real: estudos/integracao-visual-jornada-issue-186.md
      - Auditoria de Clareza dos Requisitos: estudos/auditoria-requisitos-issue-149.md
      - Relato de uso — aluno externo: estudos/relato-usabilidade-aluno-01-issue-148.md
      - Relato de uso — aluno da UnB: estudos/relato-usabilidade-aluno-02-issue-148.md
      - Tela exemplo API real: estudos/tela-exemplo-api-real.md
      - Validação Release 1 SIGAA 2026-09-24: estudos/validacao-release-1-sigaa-2026-09-24.md
      - Verificação ambiente completo issue 37: estudos/verificacao-ambiente-completo-issue-37.md
      - Verificação ambiente completo issue 37 tiago vieira: estudos/verificacao-ambiente-completo-issue-37-tiago-vieira.md
      - Verificação busca professor disciplina: estudos/verificacao-busca-professor-disciplina.md
      - Verificação docker compose: estudos/verificacao-docker-compose.md
      - Verificação execucao frontend: estudos/verificacao-execucao-frontend.md
      - Verificação formulario avaliacao: estudos/verificacao-formulario-avaliacao.md
      - Interface de comentários — Issue 159: estudos/interface-comentarios-issue-159.md
      - Validação integrada de comentários e moderação — Issue 163: estudos/validacao-integrada-issue-163.md
  - Processo:
      - Template de ata de reunião: atas/template-ata-reuniao.md
  - Atas:
      - 2026-09-17: atas/2026-09-17.md
  - Relatórios:
      - Relatório RF19: relatorio_rf19.md

exclude_docs: |
  agent-skills.md

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

copyright: Grupo 7 — MDS 2026/2 — Universidade de Brasília
