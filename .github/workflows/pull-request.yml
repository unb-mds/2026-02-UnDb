name: Pull request checks

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  gitflow-policy:
    name: Gitflow policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate source and target branches
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          case "$BASE_BRANCH" in
            main)
              [[ "$HEAD_BRANCH" =~ ^(release|hotfix)/[a-z0-9][a-z0-9._-]*$ ]] || {
                echo "PRs into main must come from release/* or hotfix/*."
                exit 1
              }
              ;;
            develop)
              [[ "$HEAD_BRANCH" =~ ^(feature|fix|chore|docs|release|hotfix)/[a-z0-9][a-z0-9._-]*$ ]] || {
                echo "Invalid source branch for develop. See CONTRIBUTING.md."
                exit 1
              }
              ;;
          esac

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app alembic

      - name: Import application
        env:
          SECRET_KEY: ci-only-secret
          DEBUG: "False"
          DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
        run: python -c "from app.main import app; assert app is not None"
