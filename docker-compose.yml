services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-g7}
      POSTGRES_USER: ${POSTGRES_USER:-g7}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-por-uma-senha-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-troque-por-um-valor-aleatorio}
      DEBUG: ${DEBUG:-True}
      POSTGRES_DB: ${POSTGRES_DB:-g7}
      POSTGRES_USER: ${POSTGRES_USER:-g7}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-por-uma-senha-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://g7:troque-por-uma-senha-local@db:5432/g7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
